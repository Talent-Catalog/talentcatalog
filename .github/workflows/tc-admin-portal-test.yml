name: Admin Portal Tests
on:
  pull_request:
    branches:
      - staging
      - master
    paths:
      - 'ui/admin-portal/**'
      - '.github/workflows/tc-admin-portal-test.yml'
      - '.nvmrc'
      - 'codecov.yml'
  push:
    branches:
      - staging
    paths:
      - 'ui/admin-portal/**'
      - '.github/workflows/tc-admin-portal-test.yml'
      - '.nvmrc'
      - 'codecov.yml'
      
permissions:
  contents: read

jobs:
  admin-portal-tests:
    name: Run Admin Portal Angular Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js for Angular using version from .nvmrc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ui/admin-portal/package-lock.json

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ui/admin-portal

      # Step 4: Run Angular tests using Karma
      - name: Run Admin Portal tests with coverage
        run: npm run test:coverage
        working-directory: ui/admin-portal
        env:
          CI: true

      # Step 5: Upload the report to codecov
      - name: Upload Admin Portal coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./ui/admin-portal/coverage/lcov.info
          flags: admin-portal
          name: admin-portal-coverage
          fail_ci_if_error: true
          disable_search: true

      # Step 6: Archive test results if tests fail
      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-test-results
          path: |
            ui/admin-portal/coverage
            ui/admin-portal/dist/test-results
          if-no-files-found: ignore

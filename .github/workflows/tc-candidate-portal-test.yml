name: Candidate Portal Tests

on:
  pull_request:
    branches:
      - staging
      - master
    paths:
      - 'ui/candidate-portal/**'
      - '.github/workflows/tc-candidate-portal-test.yml'
      - '.nvmrc'
      - 'codecov.yml'

  push:
    branches:
      - staging
    paths:
      - 'ui/candidate-portal/**'
      - '.github/workflows/tc-candidate-portal-test.yml'
      - '.nvmrc'
      - 'codecov.yml'

permissions:
  contents: read

jobs:
  candidate-portal-tests:
    name: Run Candidate Portal Angular Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui/candidate-portal

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: ui/candidate-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Candidate Portal tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload Candidate Portal coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./ui/candidate-portal/coverage/lcov.info
          flags: candidate-portal
          name: candidate-portal-coverage
          fail_ci_if_error: true
          disable_search: true

      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-portal-test-results
          path: |
            ui/candidate-portal/coverage
            ui/candidate-portal/dist/test-results
          if-no-files-found: ignore
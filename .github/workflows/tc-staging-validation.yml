# Run Staging Validation Only After Deployment Completes.
name: TC Staging Validation

on:
  # Called automatically by tc-test-build-deploy.yml after deployment succeeds.
  workflow_call:

  # Keep manual execution available if required.
  #
  # This is useful while building/debugging the validation pipeline.
  # Later tickets can add the real readiness and performance checks here.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-validation:
    name: Health Check (${{ matrix.instance }})
    runs-on: ubuntu-latest
    timeout-minutes: 4

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: TBB
            url: ${{ vars.TBB_STAGING_HEALTH_URL }}
          - instance: OPC
            url: ${{ vars.OPC_STAGING_HEALTH_URL }}
          - instance: GRN
            url: ${{ vars.GRN_STAGING_HEALTH_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Check staging application health
        env:
          INSTANCE: ${{ matrix.instance }}
          HEALTH_URL: ${{ matrix.url }}
        run: bash .github/scripts/check-staging-health.sh
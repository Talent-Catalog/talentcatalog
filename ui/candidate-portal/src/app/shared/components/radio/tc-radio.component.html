<label [attr.for]="id" class="tc-radio">
  <input
    type="radio"
    [id]="id"
    [name]="name"
    [value]="value"
    [checked]="value === innerValue"
    [attr.aria-labelledby]="ariaLabelledby || null"
    [attr.aria-label]="ariaLabelledby ? null : (ariaLabel || null)"
    (change)="onChangeValue(value)"
  />
  <span>{{ label }}</span>
</label>
<ng-content></ng-content>

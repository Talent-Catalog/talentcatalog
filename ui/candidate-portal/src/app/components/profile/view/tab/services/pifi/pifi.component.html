<app-error [error]="error"></app-error>
<tc-loading [loading]="loading"></tc-loading>

<div class="service-title">
  <h2>PiFi Property Guidance</h2>
  <p>Explore relocation housing options and local property insights.</p>
</div>

<div class="service-content" *ngIf="!loading">
  <p>
    Visit PiFi Property for location guidance and property search support relevant to your current relocation context.
  </p>

  <p *ngIf="assignment?.resource?.resourceCode as helpUrl">
    <a [href]="helpUrl" target="_blank" rel="noopener noreferrer">{{ helpUrl }}</a>
  </p>

  <div class="mt-5">
    <tc-button [type]="'outline'" (onClick)="onBackButtonClicked()">
      <i class="me-1 fas fa-arrow-left"></i>
      Back
    </tc-button>
  </div>
</div>
